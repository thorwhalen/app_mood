name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run backend tests
      working-directory: ./backend
      run: |
        pytest --cov=app --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./backend/coverage.xml

  e2e-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Start services
      run: |
        docker-compose up -d
        sleep 30  # Wait for services to be ready

    - name: Install Playwright
      working-directory: ./tests/e2e
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        playwright install --with-deps chromium

    - name: Run E2E tests
      working-directory: ./tests/e2e
      run: pytest --headed

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: playwright-report
        path: tests/e2e/playwright-report/

    - name: Stop services
      if: always()
      run: docker-compose down

  build:
    runs-on: ubuntu-latest
    needs: [backend-tests, e2e-tests]

    steps:
    - uses: actions/checkout@v3

    - name: Build Docker images
      run: docker-compose build

    - name: Log in to Docker Hub
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Push images
      if: github.ref == 'refs/heads/main'
      run: |
        docker tag app_mood_backend:latest ${{ secrets.DOCKER_USERNAME }}/mood-backend:latest
        docker tag app_mood_frontend:latest ${{ secrets.DOCKER_USERNAME }}/mood-frontend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/mood-backend:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/mood-frontend:latest
